name: Deploy to Firebase

# Every push to main tests, builds and publishes the app, and deploys the
# Firestore security rules. Can also be run by hand from the Actions tab.
# One-time setup is described in SETUP.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check one-time setup is done
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ ! -s .env.production ]; then
            echo "::error::.env.production is missing. Add your Firebase web app config (SETUP.md, step 5)."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT repository secret is missing (SETUP.md, step 6)."
            exit 1
          fi
          project_id=$(grep -E '^VITE_FIREBASE_PROJECT_ID=' .env.production | cut -d= -f2- | tr -d '"'"'"' \r')
          if [ -z "$project_id" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID is empty in .env.production."
            exit 1
          fi
          echo "PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Test security rules
        run: npm run test:rules
      - name: Build
        run: npm run build

      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx firebase deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/service-account.json"
          echo "Live at https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
