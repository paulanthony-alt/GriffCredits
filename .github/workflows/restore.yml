name: Restore from backup

# Replaces ALL data in the live database with a backup. Before restoring, it
# saves a backup of the current data, so a restore can itself be undone.
# Only people with write access to the repository can run this.
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Run ID of the backup to restore (the number at the end of that run's web address)"
        required: true
      confirm:
        description: "Type RESTORE to confirm. This replaces ALL current customers, history and staff records."
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          if [ "$CONFIRM" != "RESTORE" ]; then
            echo "::error::Nothing was changed. To restore, type RESTORE (in capitals) in the confirm box."
            exit 1
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The backup run ID should be just digits, e.g. 37137614900."
            exit 1
          fi

      - uses: actions/checkout@v4
      - name: Check setup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: scripts/ci/prepare.sh --need-backup-password
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download the chosen backup
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}
          pattern: griff-credits-backup-*
          merge-multiple: true
          path: incoming

      - name: Decrypt it
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          shopt -s nullglob
          files=(incoming/*.json.enc)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one backup file in run $RUN_ID, found ${#files[@]}."
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSWORD \
               -in "${files[0]}" -out "$RUNNER_TEMP/restore.json"; then
            echo "::error::Couldn't decrypt the backup. Was BACKUP_PASSWORD changed after it was made?"
            exit 1
          fi

      - name: Save the current data first (so this restore can be undone)
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          stamp=$(date -u +%Y-%m-%d-%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          scripts/ci/backup-encrypted.sh "griff-credits-backup-before-restore-$stamp.json.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: griff-credits-backup-before-restore-${{ env.STAMP }}
          path: griff-credits-backup-before-restore-${{ env.STAMP }}.json.enc
          retention-days: 90
          if-no-files-found: error

      - name: Restore
        run: npx tsx scripts/restore.ts "$RUNNER_TEMP/restore.json" --yes-replace-everything

      - name: Check the restored data
        run: npx tsx scripts/check.ts "$RUNNER_TEMP/check.md"

      - name: Summary
        if: always()
        env:
          RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          {
            echo "### Restore from backup run $RUN_ID: ${{ job.status }}"
            [ -f "$RUNNER_TEMP/check.md" ] && cat "$RUNNER_TEMP/check.md"
            echo
            echo "The data from just before this restore was saved. To go back to it, run **Restore from backup** again with run ID \`${{ github.run_id }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/restore.json"
